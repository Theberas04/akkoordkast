<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AkkoordKast">
  <defs>
    <linearGradient id="hout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc75a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b1120"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="12.5" fill="none" stroke="#25365c" stroke-width="2"/>
  <!-- hals met frets -->
  <g stroke="#3b4d78" stroke-width="1.6">
    <line x1="15" y1="15" x2="49" y2="15"/>
    <line x1="15" y1="26" x2="49" y2="26"/>
    <line x1="15" y1="37" x2="49" y2="37"/>
    <line x1="15" y1="48" x2="49" y2="48"/>
  </g>
  <!-- snaren -->
  <g stroke="#8fa3c9" stroke-width="1.4">
    <line x1="18" y1="11" x2="18" y2="52"/>
    <line x1="24.2" y1="11" x2="24.2" y2="52"/>
    <line x1="30.4" y1="11" x2="30.4" y2="52"/>
    <line x1="36.6" y1="11" x2="36.6" y2="52"/>
    <line x1="42.8" y1="11" x2="42.8" y2="52"/>
    <line x1="49" y1="11" x2="49" y2="52"/>
  </g>
  <!-- capo boven aan de hals -->
  <rect x="14" y="9" width="36" height="5" rx="2.5" fill="url(#hout)"/>
  <!-- grepen: een G-achtige greep -->
  <g fill="#f5a524">
    <circle cx="18" cy="20.5" r="3.4"/>
    <circle cx="30.4" cy="20.5" r="3.4"/>
    <circle cx="49" cy="20.5" r="3.4"/>
    <circle cx="24.2" cy="42.5" r="3.4"/>
    <circle cx="36.6" cy="42.5" r="3.4"/>
    <circle cx="42.8" cy="31.5" r="3.4"/>
  </g>
</svg>
