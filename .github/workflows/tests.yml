name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node-versie
        run: node --version
      # ffmpeg leest het geluid uit mp3/mp4 voor de muziekanalyse; op de runner
      # staat het er niet standaard op, en dan vallen twee tests om
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests
        run: node --test test/*.test.js
      - name: Bestandslijsten van de deploy
        run: python3 scripts/check-deploy-file-lists.py
